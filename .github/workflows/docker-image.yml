name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node:sqlite needs 22.13+ unflagged — see README's Node requirement.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: node --test test/*.test.mjs

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag gw1-live-trade-prices:ci

  windows-installer:
    runs-on: windows-latest
    needs: test
    env:
      # Pinned exact version — never float "latest v22". Bump deliberately
      # and re-run this job when a newer 22.x is worth picking up.
      NODE_VERSION: 22.23.2
    steps:
      - uses: actions/checkout@v4

      - name: Download portable Node.js runtime
        shell: pwsh
        run: |
          $url = "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node-extracted

      - name: Assemble installer bundle
        shell: pwsh
        run: |
          # Zero npm dependencies means no node_modules to build for win-x64
          # and no native-module risk — just node.exe itself, plus bin/src/
          # public/data as they already exist in the repo.
          $nodeSrcDir = Get-ChildItem -Directory node-extracted | Select-Object -First 1
          New-Item -ItemType Directory -Path dist\node -Force | Out-Null
          Copy-Item "$($nodeSrcDir.FullName)\node.exe" dist\node\node.exe
          Copy-Item "$($nodeSrcDir.FullName)\LICENSE" dist\node\LICENSE

          Copy-Item -Recurse bin dist\bin
          Copy-Item -Recurse src dist\src
          Copy-Item -Recurse public dist\public

          New-Item -ItemType Directory -Path dist\data -Force | Out-Null
          Copy-Item data\gwtoolbox-items.json dist\data\gwtoolbox-items.json

          Copy-Item installer\launch.bat dist\launch.bat
          Copy-Item installer\launch.vbs dist\launch.vbs

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          # Tag pushes (v1.2.3) name the installer after the tag, so what
          # ships in a release actually matches what was tagged. Anything
          # else (a plain push to main) gets a dev build tied to the commit
          # instead of silently claiming to be a real version.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = "0.0.0-$($env:GITHUB_SHA.Substring(0,7))"
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GW1TradePrices-Setup
          path: installer\Output\GW1TradePrices-Setup-*.exe

  # Only fires on a pushed tag like v1.2.3 — a plain push to main builds and
  # tests the installer (above) but never publishes anything.
  release:
    runs-on: ubuntu-latest
    needs: windows-installer
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: GW1TradePrices-Setup
          path: installer-output

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer-output/*.exe \
            --title "GW1 Live Trade Prices $GITHUB_REF_NAME" \
            --generate-notes
