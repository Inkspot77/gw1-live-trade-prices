name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # node:sqlite needs 22.13+ unflagged — see README's Node requirement.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: node --test test/*.test.mjs

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag gw1-live-trade-prices:ci
